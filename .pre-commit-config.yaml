repos:
# only works for kubernetes secrets
- repo: https://github.com/onedr0p/sops-pre-commit
  rev: v2.1.0
  hooks:
  - id: forbid-secrets
    # allow committing these files, but not others: s3cr3t.yaml, and a ServiceAccount token Secret that holds no data
    # (the cluster fills it in)
    exclude: ^(k8s/bootstrap/kustomize/personal/external-secrets/s3cr3t\.yaml|k8s/infra/longhorn-system/longhorn/base/monitoring-reader-token\.yaml)$
- repo: https://github.com/voldy/validate-sops
  rev: 'v0.1.1'  # Use the latest commit SHA or tag
  hooks:
  - id: validate-sops
    # Adjust based on your file(s) location and type(s)
    files: '.+\.sops\.(ya?ml|json|env)$'
