apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - bgp-peer-config.yaml
  - bgp-advertisement.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.18.12
    releaseName: "cilium"
    includeCRDs: true
    namespace: kube-system
    valuesFile: values.yaml
