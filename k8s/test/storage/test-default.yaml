---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: &name test-sc-default
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 333Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: &name test-sc-default
  namespace: default
spec:
  containers:
    - name: test
      command: ["sh", "-c", "while true; do echo $(date) >> /data/log.txt; sleep 5; done"]
      image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: *name