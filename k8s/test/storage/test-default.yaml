---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: &name test-sc-default
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 333Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: &name test-sc-default
  namespace: default
spec:
  containers:
    - name: test
      command: ["sh", "-c", "while true; do echo $(date) >> /data/log.txt; sleep 5; done"]
      image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: *name