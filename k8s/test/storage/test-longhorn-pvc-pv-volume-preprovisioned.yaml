apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: &name test-longhorn-all-preprovisioned
  namespace: longhorn
spec:
  dataLocality: best-effort
  frontend: blockdev
  numberOfReplicas: 1
  size: "350224384"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: &name test-longhorn-all-preprovisioned
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 333Mi
  csi:
    driver: driver.longhorn.io
    fsType: xfs
    volumeAttributes:
      numberOfReplicas: "1"
      staleReplicaTimeout: "2880"
    volumeHandle: *name
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: &name test-longhorn-all-preprovisioned
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 333Mi
  storageClassName: longhorn
  volumeName: *name
---
apiVersion: v1
kind: Pod
metadata:
  name: &name test-longhorn-all-preprovisioned
  namespace: default
spec:
  containers:
    - command: ["sh", "-c", "while true; do echo $(date) >> /data/log.txt; sleep 5; done"]
      image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
      name: test
      volumeMounts:
        - mountPath: /data
          name: data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: *name
