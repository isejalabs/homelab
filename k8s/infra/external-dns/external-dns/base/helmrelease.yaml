---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      version: 1.22.0
  interval: 1h
  values:
    domainFilters:
      - example.com # replaced per-env by replace-domain, same value spliced into --rfc2136-zone below
      - 100.51.198.in-addr.arpa # PTR zone, replaced per-env -- see k8s/components/transformers/reverse-zone-env

    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: powerdns-tsig-dynupdate
            key: TSIG_DYNUPDATE_SECRET

    extraArgs:
      - --rfc2136-host=powerdns.powerdns.svc.cluster.local
      - --rfc2136-port=53
      - --rfc2136-tsig-keyname=dynupdate
      - --rfc2136-tsig-secret-alg=hmac-sha256
      # Required for --policy=sync to list existing records (otherwise
      # external-dns can only ever create, never update/delete) -- see
      # k8s/apps/dns/powerdns's TSIG-ALLOW-AXFR grant for the other half of
      # this.
      - --rfc2136-axfr
      # Writes a PTR record alongside every A record's own zone, for the two
      # zones listed below. The older --rfc2136-create-ptr flag is deprecated
      # in favor of this provider-agnostic one. Confirmed live on dev:
      # --create-ptr refuses to start unless PTR is explicitly listed in
      # --managed-record-types alongside the default A/AAAA/CNAME set (its
      # own default doesn't include PTR) -- "config validation failed:
      # --create-ptr requires PTR in --managed-record-types". One entry per
      # type, not a comma-separated value: --managed-record-types is a
      # cumulative flag ("specify multiple times to include many").
      - --create-ptr
      - --managed-record-types=A
      - --managed-record-types=AAAA
      - --managed-record-types=CNAME
      - --managed-record-types=PTR
      # rfc2136 needs every zone it's allowed to touch listed explicitly here
      # (a bare --domain-filter entry isn't enough for this provider) -- one
      # per domainFilters entry above, forward zone first then the PTR zone.
      # Not set via the EXTERNAL_DNS_RFC2136_ZONE env var (kingpin's
      # <FLAG>-envar convention) like a single zone would be: kingpin only
      # honors an envar-set default when the flag isn't also passed via CLI
      # args at all, so as soon as a second zone needs an explicit
      # --rfc2136-zone here, an env-var-set first zone would be silently
      # dropped rather than combined with it -- both zones have to come from
      # the same place.
      #
      # Each as its own combined "--rfc2136-zone=value" entry, not split into
      # two array elements (flag, then bare value) -- tried that first, but
      # the chart's values schema requires extraArgs to be a set of unique
      # strings, and two bare "--rfc2136-zone" elements are equal regardless
      # of what follows them, so Helm rejects it. Values replaced per-env by
      # k8s/components/transformers/reverse-zone-env, which splices each
      # already-resolved zone value in after the "=" (not a "." based split
      # like ZONE/domainFilters use) specifically to avoid the "--rfc2136-zone="
      # prefix getting mangled by a delimiter that also appears inside the
      # zone name itself.
      - --rfc2136-zone=example.com
      - --rfc2136-zone=100.51.198.in-addr.arpa

    policy: sync

    provider:
      name: rfc2136

    sources:
      - gateway-httproute
      - service

    txtOwnerId: external-dns
