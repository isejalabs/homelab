---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    leaderElection:
      # Lease renewal every 10 s instead of 2 s (fewer writes to etcd); renewPeriod + renewDeadline must stay under leaseDuration
      timings:
        leaseDurationSeconds: 60
        renewDeadlineSeconds: 40
        renewPeriodSeconds: 10
        retryPeriodSeconds: 10
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
