apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/qa
  - ../../../../../components/apps/flux-operator-sso

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: keycloak-oidc-flux-operator-admin#qa
    target:
      kind: ExternalSecret
      name: flux-operator-oidc
  - patch: |-
      - op: replace
        path: /spec/values/web/config/authentication/oauth2/issuerURL
        value: https://qa-auth.qa.iseja.net/realms/admin
      - op: replace
        path: /spec/values/web/config/baseURL
        value: https://qa-flux.qa.iseja.net
    target:
      kind: HelmRelease
      name: flux-operator
