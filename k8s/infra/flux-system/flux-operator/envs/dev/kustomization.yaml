apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/dev

resources:
  - ../../base
  - clusterrolebinding.yaml
  - externalsecret.yaml

patches:
  - path: helmrelease.yaml
  - patch: |-
      - op: replace
        path: /spec/values/web/config/authentication/oauth2/issuerURL
        value: https://dev-auth.dev.iseja.net/realms/admin
      - op: replace
        path: /spec/values/web/config/baseURL
        value: https://dev-flux.dev.iseja.net
    target:
      kind: HelmRelease
      name: flux-operator
