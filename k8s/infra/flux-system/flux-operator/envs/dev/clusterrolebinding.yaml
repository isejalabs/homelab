---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-operator-web-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # predefined by the flux-operator chart (web.rbac.createRoles): read access to everything plus the Flux actions
  name: flux-web-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: sec.app.flux-operator.admin
