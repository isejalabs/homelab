---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-oidc
  # the base's namespace transformer does not reach resources of the overlay
  namespace: flux-system
spec:
  dataFrom:
    - extract:
        key: flux-operator-oidc#dev
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flux-operator-oidc
    # expected in the secret: password (the client secret of the Keycloak client `flux-operator` in the realm `admin`)
