---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-oidc
  # the base's namespace transformer does not reach resources of the overlay
  namespace: flux-system
spec:
  dataFrom:
    - extract:
        key: keycloak-oidc-flux-operator-admin#dev
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flux-operator-oidc
    # the item is written by the keycloak-realm unit (oidc_clients, client `flux-operator` in the realm `admin`); the Secret
    # has username (client ID) and password (client secret), the HelmRelease reads password
