---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flux-system

resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - http-route.yaml

configMapGenerator:
  - name: flux-operator-base-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
