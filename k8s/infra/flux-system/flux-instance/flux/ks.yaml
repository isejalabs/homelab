---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  # its pods bring their own system priority class; set-priority-class must not downgrade them
  labels:
    homelab.iseja.net/self-managed-priority: "true"
spec:
  interval: 1h
  path: ./k8s/infra/flux-system/flux-instance/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
