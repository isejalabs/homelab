---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  timeout: 10m
  values:
    instance:
      cluster:
        networkPolicy: false
        size: small
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      distribution:
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.55.0
      sync:
        interval: 10m
        kind: GitRepository
        path: "k8s/bootstrap/cluster/flux/envs/REPLACE_ME"
        ref: "refs/heads/main"
        url: "https://github.com/isejalabs/homelab"
