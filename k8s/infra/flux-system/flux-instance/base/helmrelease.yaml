---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  timeout: 10m
  values:
    instance:
      cluster:
        networkPolicy: false
        size: small
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      distribution:
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.55.0
      kustomize:
        patches:
          # Lease renewal every 15 s instead of 5 s (fewer writes to etcd); the defaults are lease 35 s, renew deadline 30 s
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --leader-election-retry-period=15s
            target:
              kind: Deployment
              name: (source-controller|kustomize-controller|helm-controller|notification-controller)
      sync:
        kind: GitRepository
        interval: 10m
        path: "k8s/bootstrap/cluster/flux/envs/REPLACE_ME"
        ref: "refs/heads/main"
        url: "https://github.com/isejalabs/homelab"
