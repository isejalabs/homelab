---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  values:
    instance:
      kustomize:
        patches:
          # Lease renewal every 15 s instead of 5 s (fewer writes to etcd); the defaults are lease 35 s, renew deadline 30 s
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --leader-election-retry-period=15s
            target:
              kind: Deployment
              name: (source-controller|kustomize-controller|helm-controller|notification-controller)
      sync:
        path: "k8s/bootstrap/cluster/flux/envs/qa"
        # Uncomment f. line to use a specific branch for this environment
        ref: "refs/heads/issue/2010_keycloak-startup-probe"
