# mTLS
authentication:
  enabled: false

## enable BGP
# URL: https://docs.cilium.io/en/stable/network/bgp-control-plane/bgp-control-plane/#installation
bgpControlPlane:
  enabled: true
bpf:
  masquerade: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

## enable egress gateway
# URL: https://docs.cilium.io/en/stable/network/egress-gateway/egress-gateway/
egressGateway:
  enabled: true
envoy:
  securityContext:
    capabilities:
      envoy: [NET_ADMIN, PERFMON, BPF]
      keepCapNetBindService: true
gatewayAPI:
  enabled: true

hubble:
  enabled: false

# https://docs.cilium.io/en/stable/network/concepts/ipam/
ipam:
  mode: kubernetes

# Talos specific
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true

loadBalancer:
  # https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#maglev-consistent-hashing
  algorithm: maglev

operator:
  # Lease renewal every 10 s instead of 2 s (fewer writes to etcd)
  extraArgs:
    - --leader-election-lease-duration=60s
    - --leader-election-renew-deadline=40s
    - --leader-election-retry-period=10s
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  rollOutPods: true
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

# Roll out cilium agent pods automatically when ConfigMap is updated.
rollOutCiliumPods: true
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
