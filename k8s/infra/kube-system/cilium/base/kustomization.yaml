apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - bgp-peer-config.yaml
  - bgp-advertisement.yaml
  - helmrelease.yaml
  - ocirepository.yaml

configMapGenerator:
  - files:
      - values.yaml
    name: cilium-base-values
    options:
      disableNameSuffixHash: true
