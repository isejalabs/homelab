# Basic Longhorn StorageClass with commonly used parameters
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-standard
  annotations:
    # reclaimPolicy is immutable: let Flux recreate the existing class once. Drop after every env has rolled out
    kustomize.toolkit.fluxcd.io/force: enabled
    # Set as default StorageClass if desired
    storageclass.kubernetes.io/is-default-class: "false"
allowVolumeExpansion: true
parameters:
  # Filesystem type: ext4 or xfs
  fsType: "ext4"

  # Number of replicas for each volume (default: 3)
  numberOfReplicas: "2"

  # Enable/disable revision counter for replica consistency
  revisionCounterDisabled: "false"

  # Stale replica timeout before rebuild (default: 30 minutes)
  staleReplicaTimeout: "30"
provisioner: driver.longhorn.io
reclaimPolicy: Delete # data is recovered from the kopiur backup, not from a leftover volume
volumeBindingMode: WaitForFirstConsumer # Bind PVC after pod creation
