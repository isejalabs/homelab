# High availability StorageClass with strict replication
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-ha
allowVolumeExpansion: true
parameters:
  # ext4 by policy — longhorn-xfs is the only class that should use xfs
  fsType: ext4

  # Three replicas ensures survival of two node failures
  numberOfReplicas: "3"

  # Auto-balance replicas when nodes are added/removed
  # Options: disabled, least-effort, best-effort
  replicaAutoBalance: "best-effort"

  # Valid values are enabled/disabled/ignored -- "true" is rejected by the CSI
  # driver outright (confirmed live: this class had zero consumers until now,
  # so this was never actually exercised). "ignored" defers to Longhorn's
  # cluster-wide default as a safe stopgap; picking a deliberate
  # enabled/disabled stance per field for a "max resilience" class is
  # follow-up work, not done here -- see issue #1380.
  replicaDiskSoftAntiAffinity: "ignored"
  replicaSoftAntiAffinity: "ignored"
  replicaZoneSoftAntiAffinity: "ignored"
provisioner: driver.longhorn.io
reclaimPolicy: Retain # Retain volume when PVC is deleted
volumeBindingMode: WaitForFirstConsumer # Bind PVC after pod creation
