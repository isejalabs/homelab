# xfs counterpart to longhorn-scratch-ext4, for staging snapshots of source
# data that lives on an xfs-backed class (longhorn-xfs, longhorn-fast, longhorn-ha).
# See longhorn-scratch-ext4 for the full rationale; identical parameters otherwise.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-scratch-xfs
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete # nothing worth retaining; avoids orphaned scratch volumes
volumeBindingMode: WaitForFirstConsumer # required for dataLocality: strict-local
parameters:
  # No redundancy: skips replica sync entirely, halving write overhead.
  numberOfReplicas: "1"

  # Places the sole replica on the same node as the consuming pod, avoiding
  # any network hop for reads/writes.
  dataLocality: strict-local

  # Must match the source volume's actual on-disk filesystem: a CSI
  # VolumeSnapshot restore is a raw block-level copy, not a reformat, so
  # mounting it with a different fsType than the source fails outright
  # ("wrong fs type, bad superblock"). Use this class only for staging
  # snapshots of xfs-backed sources (longhorn-xfs/longhorn-fast/longhorn-ha);
  # use longhorn-scratch-ext4 for ext4-backed sources (longhorn-standard/longhorn-ext4).
  fsType: xfs

  # Skips per-write revision-counter bookkeeping (used to detect split-brain
  # across replicas). Meaningless with a single replica, and the write it
  # saves is pure overhead here.
  revisionCounterDisabled: "true"
