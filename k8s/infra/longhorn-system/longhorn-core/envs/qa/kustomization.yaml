apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/qa

resources:
  - ../../base

patches:
  - path: backup-target.yaml
  - path: csi-replicacount.yaml
  - path: default-disk-labeled-nodes.yaml
  - path: minio-backup-secret.yaml
  - path: over-provisioning.yaml
  - path: http-route-oauth2-proxy.yaml
    target:
      kind: HTTPRoute
      name: longhorn
