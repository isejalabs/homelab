apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/dev

resources:
  - ../../base

patches:
  - path: issuer.yaml
    target:
      kind: HelmRelease
  - patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: keycloak-oidc-longhorn-admin#dev
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: keycloak-oidc-longhorn-admin#dev
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: oauth2-proxy-longhorn#dev
    target:
      kind: ExternalSecret
