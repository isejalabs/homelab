apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/dev

resources:
  - ../../base

patches:
  - path: issuer.yaml
    target:
      kind: HelmRelease
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: oauth2-proxy-longhorn#dev
    target:
      kind: ExternalSecret
