---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-auth
spec:
  interval: 1h
  path: ./k8s/infra/longhorn-system/longhorn-auth/base
  postBuild:
    substitute:
      APP: longhorn
      OAUTH2_PROXY_ALLOWED_GROUP: sec.app.longhorn.admin
      OAUTH2_PROXY_UPSTREAM: http://longhorn-frontend.longhorn-system.svc:80
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: longhorn-core
