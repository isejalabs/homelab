---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# The Longhorn UI (and with it, through its /v1 proxy, the whole manager API) has no login of its own. Once this policy
# selects the UI pods, they accept connections from the oauth2-proxy of this namespace only, on the port the Service
# `longhorn-frontend` targets. Nothing reaches them around the proxy: not the Gateway, not a pod of another namespace.
# kubelet probes and `kubectl port-forward` (break-glass) are not policy-checked ingress and keep working.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-ui-only-from-oauth2-proxy
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: oauth2-proxy
            app.kubernetes.io/name: oauth2-proxy
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
