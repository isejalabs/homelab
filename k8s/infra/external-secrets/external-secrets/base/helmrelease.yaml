---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  timeout: 10m
  values:
    grafanaDashboard:
      enabled: true
    leaderElect: true
    # Lease renewal every 10 s instead of 2 s (fewer writes to etcd); the lease must outlive the renew deadline
    leaderElectionLeaseDuration: 60s
    leaderElectionRenewDeadline: 40s
    leaderElectionRetryPeriod: 10s
    serviceMonitor:
      enabled: true
    webhook:
      replicaCount: 2
