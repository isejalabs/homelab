apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-passthrough
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: 10.8.6.82
  listeners:
    - name: unifi
      allowedRoutes:
        namespaces:
          from: All
      hostname: "poc-unifi.poc.iseja.net"
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
