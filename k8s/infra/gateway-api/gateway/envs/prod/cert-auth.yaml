---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-cert
  namespace: gateway-api
spec:
  dnsNames:
    # replaced by patch in kustomization.yaml, the replace-domain component would turn it into auth.prod.iseja.net
    - auth.example.com
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-cluster-issuer
    group: cert-manager.io
  secretName: auth-cert
  usages:
    - digital signature
    - key encipherment
