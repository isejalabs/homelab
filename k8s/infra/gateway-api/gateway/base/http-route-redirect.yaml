apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect-to-https
spec:
  parentRefs:
    - kind: Gateway
      name: internal-http
      group: gateway.networking.k8s.io
      sectionName: http-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
