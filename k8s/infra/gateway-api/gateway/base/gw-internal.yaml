apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: 192.168.8.80
      # shared with the internal-http Gateway so both get the same LB IP
      # (split into two Gateways because Cilium's Envoy translation leaks
      # per-hostname HTTPS routes into the HTTP listener's own route table
      # when both listeners live on one Gateway - see gateway-api/gateway/README.md
      # and https://github.com/cilium/cilium/issues/44123 for the related upstream bug class)
      io.cilium/lb-ipam-sharing-key: internal
  listeners:
    - name: https-gateway
      allowedRoutes:
        namespaces:
          from: All
      hostname: "*.example.com"
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - kind: Secret
            name: cert
            group: ""
