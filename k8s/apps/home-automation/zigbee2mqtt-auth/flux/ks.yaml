---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name zigbee2mqtt-auth
  namespace: flux-system
spec:
  interval: 1h
  path: ./k8s/apps/home-automation/zigbee2mqtt-auth/base
  postBuild:
    substitute:
      APP: zigbee2mqtt
      OAUTH2_PROXY_ALLOWED_GROUP: sec.app.zigbee2mqtt.admin
      OAUTH2_PROXY_UPSTREAM: http://zigbee2mqtt.zigbee2mqtt.svc:8080
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: zigbee2mqtt
