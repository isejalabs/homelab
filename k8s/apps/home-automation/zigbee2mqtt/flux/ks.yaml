---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt
  namespace: flux-system
spec:
  interval: 1h
  path: ./k8s/apps/home-automation/zigbee2mqtt/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  postBuild:
    substitute:
      APP: zigbee2mqtt
      # Match the app's non-root identity so Kopia restores files with usable ownership.
      PGID: "1000"
      PUID: "1000"
      STORAGE_CAPACITY: 2Gi
  dependsOn:
    - name: kopiur-repository
