---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt
spec:
  interval: 1h
  path: ./k8s/apps/home-automation/zigbee2mqtt/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  postBuild:
    substitute:
      APP: zigbee2mqtt
      PGID: "0"
      PUID: "0"
      STORAGE_CACHE_CAPACITY: 1Gi
      STORAGE_CAPACITY: 10Mi
  dependsOn:
    - name: longhorn
