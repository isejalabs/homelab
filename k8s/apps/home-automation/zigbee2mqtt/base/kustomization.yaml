---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zigbee2mqtt

components:
  - ../../../../components/apps/storage/pvc

resources:
  - ns.yaml
  - externalsecret.yaml
  - helmrelease.yaml
  - ocirepository.yaml

patches:
  # STORAGE_CAPACITY also sizes the shared Kopia cache, so keep that value
  # useful for backups and shrink only this app's data claim.
  - target:
      kind: PersistentVolumeClaim
      version: v1
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Mi
