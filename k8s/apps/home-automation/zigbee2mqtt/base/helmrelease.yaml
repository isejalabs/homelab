---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            env:
              ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_OUTPUT: '["console"]'
              ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
              # the migrated configuration.yaml sets the frontend to the Home Assistant add-on port 8099
              ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
              ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "true"
              ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: zigbee2mqtt-mqtt
                    key: MQTT_PASSWORD
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtts://mqtt.home.iseja.net:8883
              ZIGBEE2MQTT_CONFIG_MQTT_USER:
                valueFrom:
                  secretKeyRef:
                    name: zigbee2mqtt-mqtt
                    key: MQTT_USER
              ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: deconz
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyACM0
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.14.2 # renovate: docker=ghcr.io/koenkk/zigbee2mqtt
            probes:
              liveness:
                spec:
                  periodSeconds: 30
                  tcpSocket:
                    port: 8080
                custom: true
                enabled: true
              readiness:
                spec:
                  periodSeconds: 10
                  tcpSocket:
                    port: 8080
                custom: true
                enabled: true
            resources:
              limits:
                cpu: 500m
                ephemeral-storage: 128Mi
                memory: 512Mi
              requests:
                cpu: 50m
                ephemeral-storage: 64Mi
                memory: 256Mi
            securityContext:
              privileged: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
        initContainers:
          # Talos creates serial devices as root:root 0600, so the non-root main container could not open the
          # coordinator. Hand the node's device to group 1000 before it starts; privileged containers get a copy of
          # the node's device with its current owner and mode, so the chown has to hit the node's own /dev.
          # The node's /dev directory is mounted instead of /dev/ttyACM0 itself: containerd creates a directory at a
          # missing hostPath source, which then blocks the kernel from recreating the device node.
          fix-device:
            command:
              - sh
              - -c
              - chown 0:1000 /host-dev/ttyACM0 && chmod 0660 /host-dev/ttyACM0
            image:
              repository: busybox
              tag: "1.37" # renovate: docker=busybox
            securityContext:
              privileged: true
              runAsNonRoot: false
              runAsUser: 0
        replicas: 0
        strategy: Recreate

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /app/data
        type: persistentVolumeClaim
      host-dev:
        advancedMounts:
          main:
            fix-device:
              - path: /host-dev
        hostPath: /dev
        hostPathType: Directory
        type: hostPath
    route:
      main:
        kind: HTTPRoute
        enabled: true
        hostnames:
          - zigbee2mqtt.example.com
        parentRefs:
          - kind: Gateway
            name: internal
            namespace: gateway-api
            group: gateway.networking.k8s.io

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
