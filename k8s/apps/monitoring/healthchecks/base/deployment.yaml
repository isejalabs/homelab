# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name healthchecks
  labels:
    app.kubernetes.io/name: *name
spec:
  replicas: 1
  # One replica on a ReadWriteOnce volume with a SQLite file: the old pod must be gone before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
    spec:
      containers:
        - name: *name
          env:
            - name: DB
              value: sqlite
            - name: DB_NAME
              value: /data/hc.sqlite
            - name: DEBUG
              value: "False"
            - name: DEFAULT_FROM_EMAIL
              value: healthchecks@example.com
            # Not needed: the access log of the proxy already shows every request
            - name: GUNICORN_DISABLE_LOGGING
              value: "1"
            # A small instance: two workers are plenty and keep the writers on the SQLite file few
            - name: GUNICORN_WORKERS
              value: "2"
            # Accounts exist only through the login proxy (REMOTE_USER_HEADER), never by self-registration
            - name: REGISTRATION_OPEN
              value: "False"
            # oauth2-proxy sends the login name of the Keycloak account in this header and strips any copy a client sent;
            # the network policy lets nothing but the proxy reach this pod. Django form: HTTP_ + upper case, - as _.
            - name: REMOTE_USER_HEADER
              value: HTTP_X_FORWARDED_EMAIL
            - name: SITE_NAME
              value: iseja healthchecks
            # Patched per environment (the hostname of the HTTPRoute)
            - name: SITE_ROOT
              value: https://healthchecks.example.com
          # SECRET_KEY, plus optionally the EMAIL_* settings for alert emails (see the ExternalSecret)
          envFrom:
            - secretRef:
                name: *name
          image: healthchecks/healthchecks:v5.0.3@sha256:5eb96eb72dc63ac24743f1c0fc4469931155329e05c9781a0809320de0ae479c
          # /health checks the database connection and skips the ALLOWED_HOSTS check, so no Host header is needed
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 20m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        # 1000 is the PUID/PGID of the kopiur mover (apps/storage component), so file ownership is the same on both sides
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${APP}
