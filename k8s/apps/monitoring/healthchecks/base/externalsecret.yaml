---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Every field of the 1Password item `healthchecks#<env>` becomes a key of the Secret, which the Deployment reads with
# `envFrom`. Expected: SECRET_KEY (Django's signing key, for example `openssl rand -base64 48`). Optional, only for
# alert emails: EMAIL_HOST, EMAIL_PORT, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, EMAIL_USE_TLS, EMAIL_USE_SSL. The `#base`
# suffix is replaced per environment by the overlay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks
spec:
  dataFrom:
    - extract:
        key: healthchecks#base
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: healthchecks
