---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: healthchecks
  # registered by an environment's kustomization directly, not through a set that sets the namespace
  namespace: flux-system
spec:
  interval: 1h
  path: ./k8s/apps/monitoring/healthchecks/base
  postBuild:
    substitute:
      APP: healthchecks
      OAUTH2_PROXY_ALLOWED_GROUP: sec.app.healthchecks.admin
      OAUTH2_PROXY_UPSTREAM: http://healthchecks.healthchecks.svc:8000
      STORAGE_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: gateway-api
    - name: longhorn
