---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name checkmk-kube-agent
spec:
  interval: 1h
  chart:
    spec:
      chart: checkmk
      version: 1.11.0
      sourceRef:
        kind: HelmRepository
        name: *name
        namespace: *name
  timeout: 10m
  values:
    clusterCollector:
      resources:
        requests:
          cpu: 30m
          memory: 70Mi
        limits:
          cpu: 100m
          memory: 120Mi

    nodeCollector:
      # collect metrics also on control plane nodes
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"

      cadvisor:
        resources:
          requests:
            cpu: 15m
            memory: 40Mi
          limits:
            cpu: 100m
            memory: 50Mi

      containerMetricsCollector:
        resources:
          requests:
            cpu: 15m
            memory: 40Mi
          limits:
            cpu: 100m
            memory: 50Mi

      machineSectionsCollector:
        resources:
          requests:
            cpu: 30m
            memory: 35Mi
          limits:
            cpu: 100m
            memory: 40Mi
