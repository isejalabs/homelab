apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-ingress
spec:
  hostnames:
    - "whoami.example.com"
    - "whoami-ingress.example.com"
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: gateway-api
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: whoami-gw
          group: ""
          port: 80
          weight: 1
