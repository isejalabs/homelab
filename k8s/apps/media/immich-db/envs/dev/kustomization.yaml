apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/dev

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: immich-db
      spec:
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 256Mi
        storage:
          size: 3Gi
    target:
      kind: Cluster
      name: immich-db
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: immich-db-dump
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: upload
                    env:
                      - name: BUCKET
                        value: dev-immich-db
    target:
      kind: CronJob
      name: immich-db-dump
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: immich-db#dev
    target:
      kind: ExternalSecret
      name: immich-db-backup
