apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/qa

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: immich-db-dump
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: upload
                    env:
                      - name: BUCKET
                        value: qa-immich-db
    target:
      kind: CronJob
      name: immich-db-dump
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: immich-db#qa
    target:
      kind: ExternalSecret
      name: immich-db-backup
