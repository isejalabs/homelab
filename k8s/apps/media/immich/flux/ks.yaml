---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name immich
  # registered through the Flux set `qa-soaking` (k8s/bootstrap/cluster/flux/sets/qa-soaking), not per environment
spec:
  interval: 1h
  path: ./k8s/apps/media/immich/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  # the namespace `immich` is created by immich-db, which this unit shares it with
  dependsOn:
    - name: immich-db
