---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name immich
  # registered through the Flux set `qa-soaking` (k8s/bootstrap/cluster/flux/sets/qa-soaking), not per environment
spec:
  interval: 1h
  path: ./k8s/apps/media/immich/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      # names the machine learning model cache (components/apps/storage/pvc-no-backup); the model download is
      # regenerable, 5Gi holds the default models several times over
      APP: immich-ml-cache
      STORAGE_CAPACITY: 5Gi
  # The first start pulls two images of 1.5 GB or more and runs Immich's database migrations. The health wait ends
  # after spec.timeout, which defaults to the interval (10m in dev and rebuild).
  timeout: 20m
  wait: true
  # the namespace `immich` is created by immich-db, which this unit shares it with
  dependsOn:
    - name: immich-db
