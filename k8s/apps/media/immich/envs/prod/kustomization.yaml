---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/prod

resources:
  - ../../base

# Export paths on the NAS `fiona`, see docs/operations/immich-media-storage.md for the datasets behind them. The live library is exported read-only, the
# unit is registered in prod with the promotion (#2149).
patches:
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/natascha1/data/srv/immich/upload
    target:
      kind: PersistentVolume
      name: immich-upload
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/fiona2/gamma/srv/immich/prod/cache
    target:
      kind: PersistentVolume
      name: immich-cache
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/natascha1/data/media/Pictures/orig
    target:
      kind: PersistentVolume
      name: immich-library
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/natascha1/data/media/Pictures/export
    target:
      kind: PersistentVolume
      name: immich-export
