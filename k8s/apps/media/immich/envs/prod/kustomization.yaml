---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/prod

resources:
  - ../../base

# Export paths on the NAS `fiona`, see docs/operations/immich-media-storage.md for the datasets behind them. The
# library and rendition paths are placeholders until the owner names the datasets of the live Lightroom library
# (#2144); prod does not run the unit yet (registered with the promotion to prod, #2149).
patches:
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/natascha1/immich/prod/upload
    target:
      kind: PersistentVolume
      name: immich-upload
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/natascha1/immich/prod/cache
    target:
      kind: PersistentVolume
      name: immich-cache
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/natascha1/data/media/LIBRARY_DATASET
    target:
      kind: PersistentVolume
      name: immich-library
  - patch: |-
      - op: replace
        path: /spec/nfs/path
        value: /mnt/natascha1/data/media/RENDITIONS_DATASET
    target:
      kind: PersistentVolume
      name: immich-renditions
