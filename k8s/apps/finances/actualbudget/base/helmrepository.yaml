---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: community-charts
  # pre-set namespace to allow renovate linking HelmRelease and HelmRepository
  # as it cannot cope with NS set by kustomize
  # https://docs.renovatebot.com/modules/manager/flux/#helmrelease-support
  namespace: actualbudget
spec:
  interval: 1h
  url: https://community-charts.github.io/helm-charts
