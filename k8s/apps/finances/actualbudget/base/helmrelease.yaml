---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name actualbudget
spec:
  chart:
    spec:
      chart: *name
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: *name
      version: 1.9.4
  interval: 1h
  values:
    image:
      # track image version separately b/c helm chart version is not always up-to-date with the actual image version
      tag: "26.9.0" # renovate: docker=ghcr.io/actualbudget/actual-server versioning=loose

    persistence:
      enabled: true
      existingClaim: ${APP}

    # chart defaults to uid/gid 1001; pinned to 1000 here to match the kopiur
    # storage component's own PUID/PGID default, so the mover and the app
    # agree on file ownership without either side needing an override
    podSecurityContext:
      fsGroup: 1000

    securityContext:
      runAsUser: 1000
      runAsGroup: 1000

    strategy:
      type: Recreate
