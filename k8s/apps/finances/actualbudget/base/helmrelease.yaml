---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name actualbudget
spec:
  interval: 1h
  chart:
    spec:
      chart: *name
      version: 1.9.2
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: *name
  values:
    image:
      # track image version separately b/c helm chart version is not always up-to-date with the actual image version
      tag: "26.8.1" # renovate: docker=ghcr.io/actualbudget/actual-server versioning=loose

    persistence:
      enabled: true
      size: 1Gi
      storageClass: longhorn-standard

    strategy:
      type: Recreate
