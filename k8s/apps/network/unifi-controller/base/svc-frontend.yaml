---
apiVersion: v1
kind: Service
metadata:
  name: unifi-controller
  annotations:
    io.cilium/lb-ipam-ips: 192.168.8.20
    # Picked up by external-dns's service source (already enabled) -- no
    # HTTPRoute claims this name, so no CNAME/A-record type collision like
    # whoami/adguard's own resolver Service. Value replaced per-env by
    # replace-domain/prefix-domain, same mechanism as any HTTPRoute hostname.
    external-dns.kubernetes.io/hostname: unifi-controller.example.com
spec:
  externalTrafficPolicy: Local
  ports:
    - name: https-alt
      port: 8443
      targetPort: web-admin
    - name: device-comm
      port: 8080
      protocol: TCP
    - name: stun
      port: 3478
      protocol: UDP
    - name: unifi-disc
      port: 10001
      protocol: UDP
    - name: secure-redirect
      port: 8843
      protocol: TCP
    - name: http-redirect
      port: 8880
      protocol: TCP
  selector:
    app: unifi-controller
  type: LoadBalancer
