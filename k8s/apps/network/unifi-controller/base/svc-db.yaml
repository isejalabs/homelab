---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  annotations:
    # See pvc-db.yaml -- prune-safe ahead of the unifi-mongodb split (#1270).
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
  selector:
    app: mongodb
