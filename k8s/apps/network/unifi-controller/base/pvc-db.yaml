apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  annotations:
    # Ahead of splitting mongo into its own unifi-mongodb app/Kustomization
    # (#1270) -- keeps this alive across the ownership move instead of being
    # pruned the moment it disappears from this Kustomization's resource list.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 800M
  storageClassName: proxmox-csi
  volumeName: pv-mongodb
