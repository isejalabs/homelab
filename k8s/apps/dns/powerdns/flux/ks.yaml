---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: powerdns
spec:
  interval: 1h
  path: ./k8s/apps/dns/powerdns/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  postBuild:
    substitute:
      APP: powerdns
      # A DNS zone's sqlite3 file is tiny (KBs-to-low-MBs even with a few
      # hundred records) -- 128Mi leaves headroom above ext4's own overhead
      # and SQLite's WAL file without following the 5Gi default meant for
      # actual application data.
      STORAGE_CAPACITY: 128Mi
      STORAGE_CLASS: longhorn-ha
