apiVersion: v1
kind: Service
metadata:
  name: adguard
  annotations:
    io.cilium/lb-ipam-ips: 192.168.1.253
    # Picked up by external-dns's service source (already enabled). "-lb"
    # suffix, not the bare "adguard" name: this app's own HTTPRoute already
    # claims that name for its web UI (CNAME to the Gateway), and a raw LB
    # Service can't also claim it -- DNS forbids a CNAME and another record
    # type coexisting at the same owner name (PowerDNS refuses it outright,
    # confirmed live). Value replaced per-env by replace-domain/prefix-domain,
    # same mechanism as any HTTPRoute hostname.
    external-dns.kubernetes.io/hostname: adguard-lb.example.com
spec:
  externalTrafficPolicy: Local
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dhcp
      port: 67
      protocol: UDP
  selector:
    app: adguard
  type: LoadBalancer
