# Keeps the Deployment's images in the containerd cache of every worker node, so a rollout or
# reschedule of AdGuard does not depend on the internet being up. The image references are copied
# from the Deployment by kustomization.yaml (the references below only keep Renovate content with
# them); the pod does nothing but sleep.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-prepull
spec:
  selector:
    matchLabels:
      app: image-prepull
  template:
    metadata:
      labels:
        app: image-prepull
    spec:
      automountServiceAccountToken: false
      containers:
        - name: adguard
          command: ["sleep", "infinity"]
          image: docker.io/adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0 # overwritten with the Deployment's image, see kustomization.yaml
          resources: &resources
            limits:
              memory: 8Mi
            requests:
              cpu: 1m
              memory: 4Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
        - name: busybox
          command: ["sleep", "infinity"]
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4 # overwritten with the Deployment's init container image, see kustomization.yaml
          resources: *resources
          securityContext: *securityContext
      securityContext:
        seccompProfile:
          type: RuntimeDefault
