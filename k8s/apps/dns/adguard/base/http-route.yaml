apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
spec:
  hostnames:
    - "adguard.example.com"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: gateway-api
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: adguard-ui
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
