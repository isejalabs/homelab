apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
spec:
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      containers:
        - env:
            - name: DISABLE_SET_PERMS
              value: "true"
          envFrom:
            - configMapRef:
                name: unbound-env
          image: docker.io/madnuttah/unbound:1.26.0-1-quic@sha256:7078e62ecd3f652af3c2e107d63bbf505bd3046f9d9b4a45d40367f6ea342ce8
          livenessProbe:
            exec:
              command: ['/usr/local/unbound/sbin/healthcheck.sh']
          name: unbound
          ports:
            - containerPort: 5335
              name: dns-tcp
              protocol: TCP
            - containerPort: 5335
              name: dns-udp
              protocol: UDP
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /usr/local/unbound/conf.d/access-control.conf
              name: unbound-conf
              subPath: access-control.conf
            - mountPath: /usr/local/unbound/conf.d/logging-default.conf
              name: unbound-conf
              subPath: logging-default.conf
            # - name: unbound-conf
            #   mountPath: /usr/local/unbound/conf.d/logging-verbose.conf
            #   subPath: logging-verbose.conf
            - mountPath: /usr/local/unbound/conf.d/rootless.conf
              name: unbound-conf
              subPath: rootless.conf
            - mountPath: /usr/local/unbound/unbound.conf
              name: unbound-conf
              subPath: unbound.conf
            - mountPath: /usr/local/unbound/zones.d/iseja.conf
              name: iseja-zone
              subPath: unbound-iseja.conf
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000 # _unbound user
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            items:
              - key: access-control.conf
                path: access-control.conf
              - key: logging-default.conf
                path: logging-default.conf
              - key: logging-verbose.conf
                path: logging-verbose.conf
              - key: rootless.conf
                path: rootless.conf
              - key: unbound.conf
                path: unbound.conf
            name: unbound-conf
          name: unbound-conf
        - configMap:
            items: [{key: unbound-iseja.conf, path: unbound-iseja.conf}]
            name: unbound-zones
          name: iseja-zone
