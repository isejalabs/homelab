server:
    interface: 0.0.0.0
    interface: ::0
	module-config: "validator iterator"
    username: "_unbound"
    directory: "/usr/local/unbound"
    chroot: ""
    do-daemonize: no
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt	
    port: 5335
    # keep popular names fresh and, if upstream is unreachable, answer expired entries
    # (bounded, 1 day) from cache so external names survive an internet outage
    prefetch: yes
    serve-expired: yes
    serve-expired-client-timeout: 1800
    serve-expired-ttl: 86400
include-toplevel: "/usr/local/unbound/conf.d/*.conf"
include-toplevel: "/usr/local/unbound/zones.d/*.conf"