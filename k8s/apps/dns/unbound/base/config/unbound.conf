server:
    interface: 0.0.0.0
    interface: ::0
	module-config: "validator iterator"
    username: "_unbound"
    directory: "/usr/local/unbound"
    chroot: ""
    do-daemonize: no
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt	
    port: 5335
    # DNSSEC: the validator module is only effective with a trust anchor. The image ships the
    # root key as an RFC 5011 autotrust file (refreshed by unbound-anchor at container start).
    # iseja.net stays unvalidated via domain-insecure in zones.d.
    auto-trust-anchor-file: "/usr/local/unbound/iana.d/root.key"
    # the cluster network (Cilium) has no IPv6, so skip the unreachable IPv6 root/authoritative
    # servers instead of trying them first; clients and upstreams are IPv4 only
    do-ip6: no
    # caches sized for a handful of clients behind AdGuard, rrset = 2x msg as recommended by
    # unbound; stays well within the 128Mi memory limit (defaults are 4m each)
    msg-cache-size: 8m
    rrset-cache-size: 16m
    # keep popular names fresh and, if upstream is unreachable, answer expired entries
    # (bounded, 1 day) from cache so external names survive an internet outage
    prefetch: yes
    serve-expired: yes
    serve-expired-client-timeout: 1800
    serve-expired-ttl: 86400
include-toplevel: "/usr/local/unbound/conf.d/*.conf"
include-toplevel: "/usr/local/unbound/zones.d/*.conf"