apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: unbound

resources:
  - ns.yaml
  - daemonset-image-prepull.yaml
  - deployment.yaml
  - svc.yaml
configMapGenerator:
  - name: unbound-env
    literals:
      - TZ="Europe/Berlin"
      - EXTENDED_HEALTHCHECK="true"
      - EXTENDED_HEALTHCHECK_DOMAIN="localhost"
  - name: unbound-conf
    files:
      - config/conf.d/access-control.conf
      - config/conf.d/logging-default.conf
      - config/conf.d/logging-verbose.conf
      - config/conf.d/rootless.conf
      - config/unbound.conf
  - name: unbound-zones
    files:
      - config/zones.d/unbound-iseja.conf

replacements:
  # the pre-pull DaemonSet caches exactly the image the Deployment runs (deployment.yaml is the one place that states it)
  - source:
      kind: Deployment
      name: unbound
      fieldPath: spec.template.spec.containers.[name=unbound].image
    targets:
      - select:
          kind: DaemonSet
          name: image-prepull
        fieldPaths:
          - spec.template.spec.containers.[name=unbound].image
