apiVersion: v1
kind: Service
metadata:
  name: unbound
  annotations:
    io.cilium/lb-ipam-ips: 192.168.8.11
spec:
  externalTrafficPolicy: Local
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
  selector:
    app: unbound
  type: LoadBalancer
