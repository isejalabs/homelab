---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  hostnames:
    - "auth.example.com"
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: gateway-api
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Keycloak runs with proxy.headers: xforwarded and has no proxy-trusted-addresses, so it believes whatever
        # X-Forwarded-* reaches it. Envoy overwrites X-Forwarded-Proto itself but passes a client's -Host, -Port and
        # -Prefix through, and Keycloak builds the issuer and every redirect URL from them (a forged -Port or -Prefix
        # changes the issuer). Drop them here so only headers set by the proxy count (docs/identity/keycloak-exposure.md).
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Forwarded-Host
              - X-Forwarded-Port
              - X-Forwarded-Prefix
      backendRefs:
        - kind: Service
          name: keycloak-service
          group: ""
          port: 8080
          weight: 1
