---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
spec:
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  # a single PostgreSQL instance; scale to 2 once drains during upgrades become a nuisance
  enablePDB: false
  instances: 1
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: keycloak-db
  # WAL is the volume's main consumer, not data (13 MB). CloudNativePG defaults would keep 512MB of WAL
  # (wal_keep_size) and switch a 16MB segment every 5 min (archive_timeout), which filled the 1Gi volume in
  # about 5 h in qa while archiving was failing. Single instance, no replicas, a 30 min archive lag is well
  # within the 24 h RPO.
  postgresql:
    parameters:
      archive_timeout: 30min
      max_wal_size: 256MB
      min_wal_size: 64MB
      wal_compression: "on"
      wal_keep_size: 64MB
      wal_level: replica
  # provisional, from an idle dev measurement (~75Mi, 14m); revisit after the qa soak
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
  storage:
    size: 1Gi
    storageClass: longhorn-ha
