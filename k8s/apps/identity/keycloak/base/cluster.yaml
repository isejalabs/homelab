---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  annotations:
    # No WAL archiving: the database is backed up by a daily pg_dump (cronjob-dump.yaml), so a failing backup
    # target can never make WAL pile up on the volume (docs/keycloak-backup-restore.md). Sets archive_mode=off.
    cnpg.io/skipWalArchiving: enabled
spec:
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  # a single PostgreSQL instance; scale to 2 once drains during upgrades become a nuisance
  enablePDB: false
  instances: 1
  # Single instance without replicas and without archiving: keep only what crash recovery and checkpoints need.
  # CloudNativePG defaults would retain 512MB of WAL (wal_keep_size) on this 1Gi volume.
  postgresql:
    parameters:
      max_wal_size: 256MB
      min_wal_size: 64MB
      wal_compression: "on"
      wal_keep_size: 64MB
      wal_level: replica
  # provisional, from an idle dev measurement (~75Mi, 14m); revisit after the qa soak
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
  storage:
    size: 1Gi
    storageClass: longhorn-ha
