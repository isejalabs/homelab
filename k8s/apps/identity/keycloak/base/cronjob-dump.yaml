---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-db-dump
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
              command:
                - /bin/sh
                - -ec
                - |
                  # Keep the newest 14 dumps. Only keycloak-* objects are candidates, and the dump just uploaded is
                  # skipped by name, so a clock or sort problem can never delete it.
                  name="keycloak-$(date -u +%Y-%m-%dT%H%M%SZ).dump"
                  test -s /dump/keycloak.dump
                  aws s3 cp /dump/keycloak.dump "s3://${BUCKET}/${name}" --only-show-errors
                  aws s3 ls "s3://${BUCKET}/${name}"
                  old=$(aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix keycloak- --query 'sort_by(Contents,&LastModified)[:-14].Key' --output text)
                  for key in $old; do
                    [ "$key" = "None" ] && break
                    [ "$key" = "${name}" ] && continue
                    aws s3 rm "s3://${BUCKET}/${key}" --only-show-errors
                  done
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-backup
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_DEFAULT_REGION
                  value: default
                - name: AWS_ENDPOINT_URL
                  value: https://fiona.home.iseja.net:9000
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-backup
                      key: AWS_SECRET_ACCESS_KEY
                - name: BUCKET
                  # bucket name is rewritten per environment (<env>-keycloak-db)
                  value: base-keycloak-db
                - name: HOME
                  value: /tmp
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: dump
                  mountPath: /dump
          initContainers:
            - name: dump
              # overwritten with the Cluster's spec.imageName by the replacement in kustomization.yaml; this copy only
              # satisfies the schema and keeps Renovate's bump of cluster.yaml and of this line in one PR
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:348997438269fddc0e2825e00594367ad61751adb08a7698a0a14f793b0dc2ce
              command:
                - /bin/sh
                - -ec
                - |
                  pg_dump --format=custom --file=/dump/keycloak.dump
                  # pg_restore must be able to read the table of contents, else the job fails before anything is uploaded
                  pg_restore --list /dump/keycloak.dump > /dev/null
              env:
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-app
                      key: dbname
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-app
                      key: host
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-app
                      key: password
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-app
                      key: username
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: dump
                  mountPath: /dump
          restartPolicy: Never
          securityContext:
            fsGroup: 26
            runAsGroup: 26
            runAsNonRoot: true
            runAsUser: 26
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: dump
              emptyDir:
                sizeLimit: 256Mi
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  timeZone: Europe/Berlin
