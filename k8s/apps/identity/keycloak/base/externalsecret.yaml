---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  dataFrom:
    - extract:
        key: keycloak-bootstrap-admin#base
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: keycloak-bootstrap-admin
    # expected in the secret: username, password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-backup
spec:
  dataFrom:
    - extract:
        key: keycloak-db#base
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: keycloak-db-backup
    # expected in the secret: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-ucs-ca
spec:
  data:
    # the CA certificate is public; it is a Secret only because the Keycloak Operator reads truststores from Secrets
    - remoteRef:
        key: ucs-ca
        property: ca.pem
      secretKey: ca.pem
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: keycloak-ucs-ca
    # expected in the secret: ca.pem
