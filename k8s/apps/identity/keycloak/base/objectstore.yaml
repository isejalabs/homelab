---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: keycloak-db
spec:
  configuration:
    # bucket name is rewritten per environment (<env>-keycloak-db)
    destinationPath: s3://base-keycloak-db/
    endpointURL: https://fiona.home.iseja.net:9000
    s3Credentials:
      accessKeyId:
        name: keycloak-db-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: keycloak-db-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
  retentionPolicy: 30d
