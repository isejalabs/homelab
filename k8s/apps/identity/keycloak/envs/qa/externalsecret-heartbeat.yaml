---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-heartbeat
spec:
  dataFrom:
    - extract:
        key: keycloak-db-heartbeat#qa
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: keycloak-db-heartbeat
    # expected in the secret: HEARTBEAT_URL (the healthchecks.io ping URL of this environment's check)
