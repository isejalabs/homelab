apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/rebuild

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: rebuild-auth.rebuild.iseja.net
    target:
      kind: Keycloak
      name: keycloak
  - patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://rebuild-keycloak-db/
    target:
      kind: ObjectStore
      name: keycloak-db
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: keycloak-bootstrap-admin#rebuild
    target:
      kind: ExternalSecret
      name: keycloak-bootstrap-admin
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: keycloak-db#rebuild
    target:
      kind: ExternalSecret
      name: keycloak-db-backup
