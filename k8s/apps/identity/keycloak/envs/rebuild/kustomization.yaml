apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/rebuild

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: rebuild-auth.rebuild.iseja.net
    target:
      kind: Keycloak
      name: keycloak
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: keycloak-db-dump
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: upload
                    env:
                      - name: BUCKET
                        value: rebuild-keycloak-db
    target:
      kind: CronJob
      name: keycloak-db-dump
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: keycloak-bootstrap-admin#rebuild
    target:
      kind: ExternalSecret
      name: keycloak-bootstrap-admin
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: keycloak-db#rebuild
    target:
      kind: ExternalSecret
      name: keycloak-db-backup
