---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-db-dump
spec:
  jobTemplate:
    spec:
      template:
        spec:
          # prod's own pins of the images the dump job runs, bumped in their own PR after qa has run the version
          # (docs/operations/update-handling.md, "Staged rollout: Keycloak and CloudNativePG").
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
          initContainers:
            - name: dump
              # pg_dump client: must equal spec.imageName in cluster.yaml of this folder
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:348997438269fddc0e2825e00594367ad61751adb08a7698a0a14f793b0dc2ce
            - name: fetch-age
              image: public.ecr.aws/aws-cli/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
