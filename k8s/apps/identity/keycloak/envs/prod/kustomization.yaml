apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../../components/envs/prod

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: auth.prod.iseja.net
    target:
      kind: Keycloak
      name: keycloak
  - patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://prod-keycloak-db/
    target:
      kind: ObjectStore
      name: keycloak-db
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: keycloak-bootstrap-admin#prod
    target:
      kind: ExternalSecret
      name: keycloak-bootstrap-admin
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: keycloak-db#prod
    target:
      kind: ExternalSecret
      name: keycloak-db-backup
