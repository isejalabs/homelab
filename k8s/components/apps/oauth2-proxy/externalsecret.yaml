---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The 1Password item holds the three keys the chart reads from `config.existingSecret`: client-id and client-secret of
# the Keycloak client, and cookie-secret (32 random bytes). The `#base` suffix is replaced per environment by the
# consumer's `envs/<env>/` overlay, like every other per-environment 1Password key of the repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  dataFrom:
    - extract:
        key: oauth2-proxy-${APP}#base
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: oauth2-proxy
