---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The three keys the chart reads from `config.existingSecret`. Client ID and client secret come from the 1Password login
# item that Terragrunt writes for the Keycloak client (module keycloak-realm, `oidc_clients`: username = client ID,
# password = client secret); the cookie secret (32 random bytes) is a separate item, since Keycloak does not know it.
# The `#base` suffixes are replaced per environment by the consumer's `envs/<env>/` overlay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  data:
    - remoteRef:
        key: keycloak-oidc-${APP}-admin#base
        property: username
      secretKey: client-id
    - remoteRef:
        key: keycloak-oidc-${APP}-admin#base
        property: password
      secretKey: client-secret
    - remoteRef:
        key: oauth2-proxy-${APP}#base
        property: cookie-secret
      secretKey: cookie-secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: oauth2-proxy
