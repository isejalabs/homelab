---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-oidc
  # the base's namespace transformer does not reach resources of the overlay
  namespace: immich
spec:
  dataFrom:
    - extract:
        key: keycloak-oidc-immich-iseja#base
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-oidc
    # the item is written by the keycloak-realm unit (oidc_clients, client `immich` in the realm `iseja`); the Secret has
    # username (client ID) and password (client secret), the HelmRelease reads password
