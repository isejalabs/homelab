apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-param
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  CLUSTER_ENVIRONMENT: dbg
  DOMAIN_BASE: dbg.iseja
  DOMAIN_TLD: net
  FLUX_RECONCILIATION_INTERVAL: 10m
  # PTR zone for this env's own 10.8.9.0/24 LB-IP range (see
  # k8s/infra/kube-system/cilium/envs/dbg/ip-pool-bgp.yaml) -- not derivable
  # from DOMAIN_BASE/DOMAIN_TLD, a separate per-env addressing scheme.
  DNS_REVERSE_ZONE: 9.8.10.in-addr.arpa.
