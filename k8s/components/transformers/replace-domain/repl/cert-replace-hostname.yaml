- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.DOMAIN_TLD
  targets:
    - select:
        kind: Certificate
      # cnpg-system's barman-cloud plugin certificates are cluster-internal (self-signed, no public domain)
      reject:
        - name: barman-cloud-client
        - name: barman-cloud-server
      fieldPaths:
        - spec.dnsNames.*
      options:
        delimiter: "."
        index: 2
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.DOMAIN_BASE
  targets:
    - select:
        kind: Certificate
      # cnpg-system's barman-cloud plugin certificates are cluster-internal (self-signed, no public domain)
      reject:
        - name: barman-cloud-client
        - name: barman-cloud-server
      fieldPaths:
        - spec.dnsNames.*
      options:
        delimiter: "."
        index: 1