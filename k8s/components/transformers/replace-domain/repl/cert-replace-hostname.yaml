- source:
    fieldPath: data.DOMAIN_TLD
    kind: ConfigMap
    name: cluster-param
  targets:
    - fieldPaths:
        - spec.dnsNames.*
      options:
        delimiter: "."
        index: 2
      select:
        kind: Certificate
- source:
    fieldPath: data.DOMAIN_BASE
    kind: ConfigMap
    name: cluster-param
  targets:
    - fieldPaths:
        - spec.dnsNames.*
      options:
        delimiter: "."
        index: 1
      select:
        kind: Certificate