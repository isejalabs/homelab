# Same pattern as helmrelease-powerdns-zone.yaml (bare example.com base value,
# index 0/1 not 1/2 since there's no app-label segment, TLD before BASE since
# BASE's own value contains a dot) applied to external-dns's own zone-scoping
# fields instead. Kept as its own file rather than folded into the powerdns
# one: same transformation, but two different apps' own values, not one
# shared concern.
#
# domainFilters.0 specifically, not a domainFilters.* wildcard: domainFilters
# now also carries the PTR/reverse zone at index 1 (see
# k8s/components/transformers/reverse-zone-env), which must NOT go through
# this DOMAIN_BASE/DOMAIN_TLD split -- it isn't a dotted iseja.net-style name,
# it's an in-addr.arpa. zone sourced from its own cluster-param field.
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.DOMAIN_TLD
  targets:
    - select:
        kind: HelmRelease
        name: external-dns
      fieldPaths:
        - spec.values.domainFilters.0
      options:
        delimiter: "."
        index: 1
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.DOMAIN_BASE
  targets:
    - select:
        kind: HelmRelease
        name: external-dns
      fieldPaths:
        - spec.values.domainFilters.0
      options:
        delimiter: "."
        index: 0
