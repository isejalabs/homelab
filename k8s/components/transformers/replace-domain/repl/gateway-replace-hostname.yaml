- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.DOMAIN_TLD
  targets:
    - fieldPaths:
        - spec.listeners.*.hostname
      options:
        delimiter: "."
        index: 2
      # internal-http has no hostname on any listener by design (see its
      # own comment) - a wildcard fieldPath with zero matches is a hard
      # error in kustomize, so it must be excluded here rather than matched
      reject:
        - name: internal-http
      select:
        kind: Gateway
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.DOMAIN_BASE
  targets:
    - fieldPaths:
        - spec.listeners.*.hostname
      options:
        delimiter: "."
        index: 1
      reject:
        - name: internal-http
      select:
        kind: Gateway
