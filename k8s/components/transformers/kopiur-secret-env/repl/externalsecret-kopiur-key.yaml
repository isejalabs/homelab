# replace the last segment (after "#") of kopiur-repository's ExternalSecret
# 1Password key with the environment, e.g. kopiur-backup#base -> kopiur-backup#dev.
# No-ops for apps that don't include the kopiur-backup component at all --
# the select simply matches nothing in that case.
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.CLUSTER_ENVIRONMENT
  targets:
    - select:
        kind: ExternalSecret
        name: kopiur-repository
      fieldPaths:
        - spec.dataFrom.0.extract.key
      options:
        delimiter: "#"
        index: 1
