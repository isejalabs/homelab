# replace the last segment (after "#") of each of powerdns's ExternalSecrets'
# 1Password key with the environment, e.g. powerdns-tsig-dynupdate#base ->
# powerdns-tsig-dynupdate#dev. No-ops for apps that don't include the given
# ExternalSecret at all -- each select simply matches nothing in that case.
#
# Also replaces the last segment (after "-") of the powerdns HelmRelease's own
# TSIG_AXFR_OUT_KEYNAME env var the same way, e.g. axfr-out-base ->
# axfr-out-dev -- this one has to vary per environment on the wire itself
# (unlike TSIG_DYNUPDATE_KEYNAME, which stays "dynupdate" everywhere), since
# ns2's BIND9 config slaves every environment's zone from one shared server
# where TSIG key clause names are global -- see
# k8s/apps/dns/powerdns/base/helmrelease.yaml's comment on that env var.
#
# A future powerdns-tsig-axfr-in ExternalSecret (prod-only, once the root-zone
# cutover phase lands) gets its own targets entry appended here rather than its
# own sibling transformer -- same shape, same component, one more entry.
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.CLUSTER_ENVIRONMENT
  targets:
    - select:
        kind: ExternalSecret
        name: powerdns-tsig-dynupdate
      fieldPaths:
        - spec.dataFrom.0.extract.key
      options:
        delimiter: "#"
        index: 1
    - select:
        kind: ExternalSecret
        name: powerdns-tsig-axfr-out
      fieldPaths:
        - spec.dataFrom.0.extract.key
      options:
        delimiter: "#"
        index: 1
    - select:
        kind: HelmRelease
        name: powerdns
      fieldPaths:
        - spec.values.controllers.main.containers.main.env.TSIG_AXFR_OUT_KEYNAME
        - spec.values.controllers.main.initContainers.bootstrap-zone.env.TSIG_AXFR_OUT_KEYNAME
      options:
        delimiter: "-"
        index: 2
