# replace the last segment (after "#") of powerdns-tsig-dynupdate's ExternalSecret
# 1Password key with the environment, e.g. powerdns-tsig-dynupdate#base ->
# powerdns-tsig-dynupdate#dev. No-ops for apps that don't include powerdns's
# ExternalSecret at all -- the select simply matches nothing in that case.
#
# A future powerdns-tsig-axfr-out/-in ExternalSecret (prod-only, once the root-zone
# cutover phase lands) gets its own entry appended here rather than its own sibling
# transformer -- same shape, same component, one more targets entry.
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.CLUSTER_ENVIRONMENT
  targets:
    - select:
        kind: ExternalSecret
        name: powerdns-tsig-dynupdate
      fieldPaths:
        - spec.dataFrom.0.extract.key
      options:
        delimiter: "#"
        index: 1
