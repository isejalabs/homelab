# replace the last segment (after "#") of powerdns-tsig's ExternalSecret 1Password
# key with the environment, e.g. powerdns-tsig#base -> powerdns-tsig#dev.
# No-ops for apps that don't include powerdns's ExternalSecret at all -- the select
# simply matches nothing in that case.
- source:
    kind: ConfigMap
    name: cluster-param
    fieldPath: data.CLUSTER_ENVIRONMENT
  targets:
    - select:
        kind: ExternalSecret
        name: powerdns-tsig
      fieldPaths:
        - spec.dataFrom.0.extract.key
      options:
        delimiter: "#"
        index: 1
