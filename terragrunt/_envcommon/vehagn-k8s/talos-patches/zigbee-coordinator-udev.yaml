# Make the ConBee II (dresden elektronik, 1cf1:0030) usable by the non-root Zigbee2MQTT container whenever the kernel
# (re-)creates its device node. Talos creates serial devices as root:root 0600, and the stick re-enumerates on every USB
# reset, so a one-time chown of the node does not survive.
#
# MODE only, no GROUP: udevd on Talos has no group database and rejects GROUP="1000" ("Failed to resolve group '1000',
# ignoring: Unknown group"). Opening the device from a pod still requires a privileged container (device cgroup), so
# the permissive mode does not widen who can reach it. Harmless on nodes without the stick.
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  - SUBSYSTEM=="tty", ATTRS{idVendor}=="1cf1", ATTRS{idProduct}=="0030", MODE="0666"
