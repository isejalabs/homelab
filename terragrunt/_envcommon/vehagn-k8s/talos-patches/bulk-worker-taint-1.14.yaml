# Keeps regular workloads off a worker that is normally powered off (the bulk-import worker on pve6, see #2147).
# Soft on purpose: PreferNoSchedule lets the scheduler place a pod there only when nothing else fits, and it does not stop
# DaemonSet pods (Longhorn, Cilium, CSI), which the node needs to join and to attach volumes. A pod that should run on
# it (the Immich server during the bulk import) selects the node by name or by its `topology.kubernetes.io/zone` label.
#
# Talos 1.14+ variant: node taints are on the KubeNodeConfig document (machine.nodeTaints is the older one).
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  bulk-import: "true:PreferNoSchedule"
