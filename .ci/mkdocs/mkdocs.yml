site_name: isejalabs homelab
site_description: Documentation for the isejalabs homelab - Proxmox, Talos Linux, Kubernetes and Flux CD, provisioned as code.
site_url: https://isejalabs.github.io/homelab/
repo_url: https://github.com/isejalabs/homelab
repo_name: isejalabs/homelab
edit_uri: edit/main/

# MkDocs refuses a docs_dir that contains mkdocs.yml, so this file lives in .ci/mkdocs/ and docs_dir points
# back at the repository root. The Markdown stays where it is (docs/, plus READMEs next to the code they describe); the whole checkout is
# the docs_dir and exclude_docs keeps everything but documentation out. See docs/decisions/0017-docs-site-generator.md.
docs_dir: ../..
# site_dir must not sit inside docs_dir (the checkout), so it is the sibling directory ../homelab-site.
site_dir: ../../../homelab-site
exclude_docs: |
  # everything that is not Markdown or an image, in every directory
  *
  !*/
  !*.md
  !*.png
  !*.svg
  !*.jpg
  !*.jpeg
  !*.gif
  !*.webp
  # the theme's own stylesheets, scripts and fonts are matched by these patterns too and would be dropped
  # with everything else; they all live under the root-level assets/ directory of the built site
  !/assets/**
  # directories that hold no site content (a trailing /** is needed: a bare directory pattern does not win
  # against the re-inclusion of directories above)
  /.git/**
  /.github/**
  /.agents/**
  /.claude/**
  /.codex/**
  /.commons/**
  /.ci/**
  /.vscode/**
  /_attic/**
  /ZZ.bak/**
  /terragrunt/**/.terraform/**
  # agent instructions and local tooling notes, not documentation
  /AGENTS.md
  /CLAUDE.md
  /scripts/mink-codex-hook.md

use_directory_urls: true

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to system preference
  features:
  - content.action.edit
  - content.code.copy
  - navigation.indexes
  - navigation.instant
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.suggest
  - toc.follow

hooks:
- hooks.py

plugins:
- search

markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: true
    # GitHub-compatible heading anchors, so `#anchor` links work the same on github.com and on the site
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true

extra:
  # When true, keeps the site out of search engines (meta tag and robots.txt). Switched off with the owner's
  # go-ahead while the public-disclosure decision (#1601) is still pending.
  noindex: false
  social: []

