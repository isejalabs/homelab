[tools]
# just bootstrap::cluster (k8s/bootstrap) - shared across enough workflows/scripts that splitting these out
# per-directory (see terragrunt/.mise.toml, k8s/.mise.toml, #1426) isn't worth the coordination cost
"1password-cli" = "2.39.0" # "1password-cli" and "op" are aliases of the same mise registry entry (registry/1password.toml in jdx/mise) -- version tracking for this one dependency comes from a custom Renovate datasource (.github/renovate/custom-datasource-1password-cli.json5), not the built-in mise manager, since mise's own registry entry has no working public datasource Renovate can use directly
gum = "2.0.2"
helm = "4.3.0"
helmfile = "1.8.1"
jq = "1.8.2"
just = "1.58.0"
kubectl = "1.37.0"
"github:mitsuhiko/minijinja" = "2.24.0"
yq = "4.54.1"

# CI bootstrap apps-stage validation against an ephemeral cluster (bootstrap-apps-test.yml)
kind = "0.33.0"

# SOPS secrets (scripts/sops-*-all.sh)
age = "1.3.2"
sops = "3.13.2" # pinned below latest (3.13.3): that version's aqua-registry entry lacks signer_identity/signer_issuer, so `mise install --locked` fails SLSA provenance verification -- see #1462

# CI cross-resource Flux validation (flate-test.yml)
"github:home-operations/flate" = "0.6.5"

# CI pre-commit hooks (pre-commit.yml)
pre-commit = "4.6.2"

# CI docs link-check (docs-link-check.yml)
lychee = "0.24.2"

[settings]
lockfile = true
