[tools]
# just bootstrap::cluster (k8s/bootstrap) - shared across enough workflows/scripts that splitting these out
# per-directory (see terragrunt/.mise.toml, k8s/.mise.toml, #1426) isn't worth the coordination cost
"aqua:1password/cli" = "2.42.0" # aqua backend, not the default vfox one of the "1password-cli"/"op" registry names: `mise lock` hashes the zip itself, vfox records a URL only and `mise install --locked` then fails on a cold cache -- version tracking: custom Renovate datasource, see .github/renovate/custom-datasource-1password-cli.json5
gum = "2.0.2"
helm = "4.3.2"
helmfile = "1.8.4"
jq = "1.8.2"
just = "1.59.0"
kubectl = "1.37.0"
"github:mitsuhiko/minijinja" = "3.1.0"
yq = "4.54.3"

# CI bootstrap apps-stage validation against an ephemeral cluster (bootstrap-apps-test.yml)
kind = "0.33.0"

# SOPS secrets (scripts/tools/sops-*-all.sh)
age = "1.3.2"
sops = "3.13.3"

# CI cross-resource Flux validation (flate-test.yml)
"github:home-operations/flate" = "v0.8.0"

# CI pre-commit hooks (pre-commit.yml)
pre-commit = "4.7.0"

# CI docs link-check (docs-link-check.yml)
lychee = "0.24.2"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
locked = true
