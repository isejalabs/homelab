terragrunt = "1.1.5"

# just bootstrap::cluster (k8s/bootstrap)
gum = "2.0.1"
helmfile = "1.8.0"
jq = "1.8.2"
just = "1.58.0"
kubectl = "1.37.0"
kustomize = "5.8.1"
"github:mitsuhiko/minijinja" = "2.24.0"
op = "2.39.0"
yq = "4.53.6"

# SOPS secrets (scripts/sops-*-all.sh) + CI schema validation (kustomize-build.yml)
age = "1.3.2"
kubeconform = "0.8.0"
sops = "3.13.3"

# CI cross-resource Flux validation (flate-test.yml)
"github:home-operations/flate" = "0.6.5"

[settings]
lockfile = true
