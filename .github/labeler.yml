      - any-glob-to-any-file:
          - "k8s/**/envs/qa/**"
          - "terragrunt/*/*/qa/**"
"env:dev":
  - changed-files:
      - any-glob-to-any-file:
          - "k8s/**/envs/dev/**"
          - "terragrunt/*/*/dev/**"
"env:src":
  - changed-files:
      - any-glob-to-any-file:
          - "k8s/**/envs/src/**"
          - "terragrunt/*/*/src/**"
"env:poc":
  - changed-files:
      - any-glob-to-any-file:
          - "k8s/**/envs/poc/**"
          - "terragrunt/*/*/poc/**"
"env:rebuild":
  - changed-files:
      - any-glob-to-any-file:
