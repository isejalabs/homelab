# vim:sw=2:ts=2:expandtab:ai
---
# Area
"area:ai":
  - changed-files:
      - any-glob-to-any-file:
          - ".agents/**"
          - ".claude/**"
          - ".commons/**"
          - ".commons"
          - "AGENTS.md"
          - "CLAUDE.md"
"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".ci/**"
          - ".github/**"
          - ".vscode/**"
          - "scripts/**"
          - "**/*.just"
          - ".justfile"
"area:docs":
  # #1416 found the original any-glob-to-any-file list (2 real patterns + 5 negations) ORed every pattern
  # across every changed file, mislabeling almost anything. #1421's `all:`-wrapped fix solved that but
  # introduced a subtler bug (#1424): all-globs-to-all-files checks every changed file in the whole PR, not
  # just the one that matched the positive pattern, so a PR touching both docs/** and AGENTS.md (a very
  # normal combination) failed to get area:docs at all, since AGENTS.md fails "every file isn't AGENTS.md".
  # actions/labeler's top-level match-config list is AND'd (verified against its actual source, not just its
  # README), so an all:-wrapped alternative can never be OR'd against a bare one in the same label - there's
  # no way to express "either A, or (B and not C)" here. Fixed at the root instead: "**/README.md" matches
  # every subsystem README (the actual thing "**/*.md" was trying to catch) without ever colliding with
  # AGENTS.md/CLAUDE.md/anything under .agents/**/.claude/**/.commons (none of those are literally named
  # README.md - verified against every git-tracked .md file in the repo), so no exclusion is needed at all.
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/README.md"
"area:k8s":
  - changed-files:
      - any-glob-to-any-file:
          - "k8s/**"
"area:terraform":
  - changed-files:
      - any-glob-to-any-file:
          - "terragrunt/**"
          - "tofu/**"
          # a terragrunt/opentofu version bump lives here, not under terragrunt/** - see #1416. This
          # also flags on an unrelated tool's version bump in the same file (file-level match, not
          # line-level); accepted as the safe direction, see #1416's "Alternatives considered".
          - ".mise.toml"
          - "mise.lock"

