name: "Pre-commit"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  pre-commit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        install_args: pre-commit
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - run: pre-commit run --show-diff-on-failure --color=always --all-files
    - run: scripts/ci/test-disclosure-hooks.sh
  # Advisory: its own job, so its own status check, which is not a required one on main (see
  # docs/architecture/ci.md#script-lint-advisory). A hit shows up red on the PR but never blocks the merge.
  script-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        install_args: pre-commit just
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-script-lint-${{ hashFiles('.pre-commit-config.yaml') }}
    # The two hooks of the manual stage, which the required job above does not run.
    - run: pre-commit run --hook-stage manual --color=always --all-files shellcheck
    - if: ${{ !cancelled() }}
      run: pre-commit run --hook-stage manual --show-diff-on-failure --color=always --all-files just-fmt
