name: "Docs mermaid check"
on:
  pull_request:
    paths:
    - '**/*.md'
    - docs/.mise.toml
    - .github/workflows/docs-mermaid-check.yml
  push:
    branches:
    - main
    paths:
    - '**/*.md'
    - docs/.mise.toml
    - .github/workflows/docs-mermaid-check.yml
  workflow_dispatch:

jobs:
  docs-mermaid-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # the action would run `mise install --locked` as soon as the root mise.lock exists, which docs/.mise.toml
        # (an npm-backed tool, no lockfile, see there) does not support, so the tool is installed by the next step
        install: false
    - name: Install the Mermaid CLI
      working-directory: docs
      run: mise install
    # GitHub renders an invalid mermaid fence as an error box instead of failing anything, so parse every fence
    # with the same library here (mmdc exits non-zero on a syntax error). _attic/ZZ.bak are retired material, as
    # for docs-link-check.yml. The sandbox is off because the runner's Chromium cannot create user namespaces.
    - name: Parse every mermaid block
      run: |
        tmp="$(mktemp -d)"
        mmdc=(mise exec --cd docs -- mmdc)
        printf '{"args":["--no-sandbox"]}\n' > "$tmp/puppeteer.json"
        git ls-files -z -- '*.md' ':!:_attic' ':!:ZZ.bak' | while IFS= read -r -d '' f; do
          awk -v dir="$tmp" -v base="$(printf '%s' "$f" | tr '/' '%')" '
            /^[[:space:]]*```mermaid[[:space:]]*$/ { inb = 1; n++; out = sprintf("%s/%s@%d.mmd", dir, base, n); next }
            /^[[:space:]]*```[[:space:]]*$/ && inb { inb = 0; close(out); next }
            inb { print > out }' "$f"
        done
        failed=0
        count=0
        for m in "$tmp"/*.mmd; do
          [ -e "$m" ] || continue
          count=$((count + 1))
          name="$(basename "$m" .mmd | tr '%' '/')"
          if ! "${mmdc[@]}" --puppeteerConfigFile "$tmp/puppeteer.json" --input "$m" --output "$m.svg" --quiet; then
            echo "::error file=${name%@*}::invalid mermaid diagram (block ${name##*@})"
            failed=1
          fi
        done
        echo "checked $count mermaid block(s)"
        exit "$failed"
