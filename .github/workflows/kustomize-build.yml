name: "Kustomize build"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          relevant:
          - "k8s/**"
          - "!k8s/**/*.md" # a README under k8s/ (there are ~17) isn't a manifest kustomize-build validates
          - ".mise.toml"
          - "mise.lock"
          - "scripts/kustomize-build-all.sh"
          - "scripts/upgrade-k8s.sh" # K8S_VERSION single source of truth, read by kustomize-build-all.sh
          - "scripts/lib/common.sh"
          - ".github/workflows/kustomize-build.yml"

  kustomize-build:
    needs: changes
    # job-level if, not a workflow-level paths: trigger filter, so this job still reports a status (skipped
    # counts as passing for required-status-checks purposes) instead of never running at all -- see #1511.
    if: needs.changes.outputs.relevant == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # kubeconform/kustomize live in k8s/.mise.toml, not the root one, so a bump to them doesn't also
        # retrigger terragrunt-validate.yml (#1426) - working_directory makes mise resolve that file, merged
        # with the root one (kubectl/gum etc.), same as running it by hand.
        working_directory: k8s
        install_args: gum kubeconform kubectl
    - run: scripts/kustomize-build-all.sh
