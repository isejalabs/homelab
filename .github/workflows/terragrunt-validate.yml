name: "Terragrunt validate"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        # default predicate-quantifier ('some') treats a '!'-prefixed pattern as its own independent
        # positive rule ("match anything not fitting this"), not a true exclusion - which matches nearly
        # every file in the repo. 'some-with-excludes' makes the negated patterns actually exclude.
        predicate-quantifier: 'some-with-excludes'
        filters: |
          relevant:
          - "terragrunt/**"
          - "!terragrunt/**/*.md" # e.g. terragrunt/README.md, terragrunt/_envcommon/README.md - not a unit
          - ".mise.toml"
          - "mise.lock"
          - "scripts/terragrunt-validate-all.sh"
          - "scripts/lib/common.sh"
          - ".github/workflows/terragrunt-validate.yml"

  terragrunt-validate:
    needs: changes
    # job-level if, not a workflow-level paths: trigger filter, so this job still reports a status (skipped
    # counts as passing for required-status-checks purposes) instead of never running at all -- see #1511.
    if: needs.changes.outputs.relevant == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Without this, every terragrunt unit downloads its own full copy of every provider it uses (no
      # shared cache dir exists on a fresh runner) - sharing one keeps network/disk bounded to the
      # number of distinct providers instead of the number of units.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # opentofu/terragrunt/talosctl live in terragrunt/.mise.toml, not the root one, so a bump to them
        # doesn't also retrigger kustomize-build.yml/bootstrap-apps-test.yml (#1426) - working_directory
        # makes mise resolve that file, merged with the root one (gum etc.), same as running it by hand.
        working_directory: terragrunt
        install_args: gum opentofu terragrunt
    # Persists provider downloads across runs, not just within one (TF_PLUGIN_CACHE_DIR above only dedupes
    # within a single run's 26 units) - keyed on what a provider requirement could plausibly follow: every
    # terragrunt.hcl's module source/version ref, plus the pinned opentofu version. See #1416.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: tf-plugin-cache-${{ hashFiles('terragrunt/**/terragrunt.hcl', 'terragrunt/.mise.toml') }}
        restore-keys: |
          tf-plugin-cache-
    - run: tofu fmt -check -recursive terragrunt/
    - run: terragrunt hcl format --check --diff --working-dir terragrunt
    - run: scripts/terragrunt-validate-all.sh
