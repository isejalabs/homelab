name: "Flate test"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  flate-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        install_args: github:home-operations/flate gum
    - run: scripts/flate-test-all.sh
