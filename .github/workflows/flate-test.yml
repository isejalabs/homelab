name: "Flate test"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  flate-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        install_args: github:home-operations/flate gum
    - run: scripts/ci/flate-test-all.sh
