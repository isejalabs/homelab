name: "Renovate config validate"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  renovate-config-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: version
        run: |
          . scripts/renovate-config-validator-version.sh
          echo "renovate=$RENOVATE_VERSION" >> "$GITHUB_OUTPUT"
      - run: npx --yes -p "renovate@${{ steps.version.outputs.renovate }}" renovate-config-validator .github/renovate.json5 .github/renovate/*.json5
