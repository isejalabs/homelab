name: "Docs link check"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  docs-link-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install_args: lychee
    # --offline: local file/anchor targets only, no network calls - deterministic, no third-party-downtime
    # flakiness. External URLs are a separate, much noisier concern (rate limits, real downtime) deliberately
    # left out of this PR-blocking check - see #1349. _attic/ZZ.bak are retired material that isn't kept up
    # to date by design, so link rot there is expected, not something to flag.
    - run: lychee --offline --no-progress --exclude-path _attic --exclude-path ZZ.bak '**/*.md'
