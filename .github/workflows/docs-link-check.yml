name: "Docs link check"
on:
  pull_request:
  push:
    branches:
    - main
  # Lets us backfill the "docs-link-check" required status check on a PR branch that predates
  # this workflow and therefore never got a pull_request event to run it on (that commit would
  # otherwise be permanently stuck with the check "Expected" and the PR unmergeable). Dispatch
  # with `--ref <branch>` to post the check onto that branch's head commit.
  workflow_dispatch:

jobs:
  docs-link-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        install_args: lychee
    # --offline: local file/anchor targets only, no network calls - deterministic, no third-party-downtime
    # flakiness. External URLs are a separate, much noisier concern (rate limits, real downtime) deliberately
    # left out of this PR-blocking check - see #1349. _attic/ZZ.bak are retired material that isn't kept up
    # to date by design, so link rot there is expected, not something to flag. --include-fragments: also
    # check that a `#anchor` exists in the target file, not only that the file exists.
    - run: lychee --offline --include-fragments --no-progress --exclude-path _attic --exclude-path ZZ.bak '**/*.md'
