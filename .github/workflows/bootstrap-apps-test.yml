name: "Bootstrap apps test"
on:
  pull_request:
    paths:
    - "k8s/bootstrap/helmfile/**"
    - "!k8s/bootstrap/helmfile/**/*.md" # none exist today, but keep this consistent with the other two
    - ".mise.toml"
    - "mise.lock"
    - "scripts/bootstrap-apps-ci-test.sh"
    - "scripts/lib/common.sh"
    - ".github/workflows/bootstrap-apps-test.yml"
  push:
    branches:
    - main
    paths:
    - "k8s/bootstrap/helmfile/**"
    - "!k8s/bootstrap/helmfile/**/*.md"
    - ".mise.toml"
    - "mise.lock"
    - "scripts/bootstrap-apps-ci-test.sh"
    - "scripts/lib/common.sh"
    - ".github/workflows/bootstrap-apps-test.yml"

jobs:
  bootstrap-apps-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        install_args: kind helm helmfile kubectl yq
    - run: scripts/bootstrap-apps-ci-test.sh
