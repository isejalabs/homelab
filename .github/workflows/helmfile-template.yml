name: "Helmfile template"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  helmfile-template:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        install_args: gum helm helmfile yq
    - run: scripts/ci/helmfile-template-all.sh
