name: "Helmfile template"
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  helmfile-template:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        install_args: gum helm helmfile yq
    - run: scripts/ci/helmfile-template-all.sh
